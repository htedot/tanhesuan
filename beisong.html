<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-font="md">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>背诵 · 碳核算</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{padding-bottom:28px}
  html,body{max-width:100%;overflow-x:hidden}
  .hd{display:flex;align-items:center;gap:10px;padding:16px 14px 8px}
  .hd a{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:var(--pri-soft);
        color:var(--pri);display:flex;align-items:center;justify-content:center;
        font-size:20px;text-decoration:none;font-weight:700}
  .hd .tt{font-size:calc(var(--fs) + 3px);font-weight:800;line-height:1.2}
  .hd .ts{font-size:calc(var(--fs) - 3px);color:var(--tx2);margin-top:2px}
  .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 14px 0}
  .bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
  .stat{display:flex;gap:10px;margin:8px 14px 12px;font-size:calc(var(--fs) - 3px);color:var(--tx2)}
  .stat b{color:var(--pri)}
  .card{margin:0 12px 12px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;
             padding:9px 13px;background:var(--pri-soft);color:var(--pri);
             font-size:calc(var(--fs) - 3px);font-weight:700}
  .card .top .k{background:var(--card);border-radius:8px;padding:2px 7px}
  .face{padding:16px 15px;font-size:calc(var(--fs) + 1px);line-height:1.75;white-space:pre-wrap;
        overflow-wrap:anywhere;min-height:150px}
  .face b{color:var(--pri)}
  .face .blank{background:var(--warn-soft);color:#7c4a03;border-radius:6px;padding:1px 6px;font-weight:700}
  .ans{display:none;padding:0 15px 14px;white-space:pre-wrap;overflow-wrap:anywhere;
       font-size:calc(var(--fs) + 1px);line-height:1.8;color:var(--ok);font-weight:700}
  .card.open .ans{display:block}
  .src{display:none;padding:0 15px 14px;font-size:calc(var(--fs) - 3px);color:var(--tx2);line-height:1.6}
  .card.open .src{display:block}
  .src .ctx{display:block;margin-top:6px;padding:8px 10px;background:var(--bg);border-radius:10px;
            white-space:pre-wrap;max-height:190px;overflow:auto}
  .acts{display:flex;gap:8px;margin:0 12px 12px}
  .acts .btn{flex:1;padding:12px 0;font-size:calc(var(--fs) - 1px);min-height:48px}
  .reveal{flex:1.4}
  .grade{display:none;gap:8px;margin:0 12px 12px}
  .card.open ~ .grade{display:flex}
  .grade button{flex:1;border:0;border-radius:12px;padding:13px 0;min-height:50px;font:inherit;
                font-size:calc(var(--fs) - 1px);font-weight:800;cursor:pointer}
  .g1{background:var(--bad-soft);color:var(--bad)}
  .g2{background:var(--warn-soft);color:#7c4a03}
  .g3{background:var(--ok-soft);color:var(--ok)}
  .opts{margin:0 12px 12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px}
  .opts .row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:calc(var(--fs) - 2px)}
  .opts .row>span{flex:0 0 62px;color:var(--tx2)}
  .opts .seg{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  .opts .seg button{border:1.5px solid var(--line);background:var(--card);color:var(--tx2);
                    font:inherit;font-size:calc(var(--fs) - 3px);font-weight:700;padding:7px 11px;
                    min-height:38px;border-radius:10px;cursor:pointer}
  .opts .seg button.on{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
  .done{margin:20px 14px;text-align:center;color:var(--tx2);line-height:1.9;font-size:calc(var(--fs) - 1px)}
  .done .big{font-size:34px;font-weight:800;color:var(--ok);display:block;margin-bottom:6px}
  /* ---- 全部卡片清单 ---- */
  .listmode .opts{display:none}
  .lst{padding:4px 14px 30px}
  .lstbar{display:flex;gap:8px;align-items:center;margin:8px 0 10px}
  .lstbar input{flex:1;min-width:0;font:inherit;font-size:calc(var(--fs) - 2px);padding:10px 12px;
                border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx)}
  .lstbar button{font:inherit;font-size:calc(var(--fs) - 3px);font-weight:700;padding:10px 12px;
                 border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--pri);white-space:nowrap}
  .lchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .lchips button{font:inherit;font-size:calc(var(--fs) - 3px);font-weight:700;padding:6px 10px;
                 border:1.5px solid var(--line);border-radius:99px;background:var(--card);color:var(--tx2)}
  .lchips button.on{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
  .lmeta{font-size:calc(var(--fs) - 4px);color:var(--tx2);margin:2px 0 10px}
  .lgrp{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;padding-bottom:6px;
        border-bottom:2px solid var(--pri-soft);font-weight:800;font-size:calc(var(--fs) - 1px);color:var(--pri)}
  .lgrp span{font-weight:600;font-size:calc(var(--fs) - 4px);color:var(--tx2)}
  .lc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;
      cursor:pointer}
  .lc .lq{font-size:calc(var(--fs) - 1px);line-height:1.6;font-weight:700}
  .lc .la{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
          white-space:pre-wrap;overflow-wrap:anywhere;font-size:calc(var(--fs) - 2px);line-height:1.75;color:var(--ok)}
  .lc.open .la{display:block}
  .lc .lt{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:calc(var(--fs) - 5px);color:var(--tx2)}
  .lc .lt em{font-style:normal;padding:1px 7px;border-radius:99px;background:var(--bg)}
  .lc .lt em.ok{background:var(--ok-soft);color:var(--ok)}
  .lc .lt em.mid{background:var(--pri-soft);color:var(--pri)}
  .lc .hint{font-size:calc(var(--fs) - 5px);color:var(--tx2)}

  /* ---- 总览 ---- */
  .hd a.ovlnk{margin-left:auto;flex:0 0 auto;width:auto;height:auto;min-height:0;padding:8px 14px;
                border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--pri);
                font-weight:700;font-size:calc(var(--fs) - 3px);text-decoration:none;white-space:nowrap;
                display:inline-flex;align-items:center}
  .ov{padding:6px 14px 28px}
  .ov h3{margin:20px 0 8px;font-size:calc(var(--fs) - 1px);color:var(--tx2);font-weight:700}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
  .kpi b{display:block;font-size:25px;line-height:1.15;font-variant-numeric:tabular-nums}
  .kpi span{font-size:calc(var(--fs) - 4px);color:var(--tx2)}
  .kpi.on b{color:var(--ok)} .kpi.mid b{color:var(--pri)} .kpi.warn b{color:var(--bad)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 13px}
  .vrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .vrow:last-child{border-bottom:0}
  .vrow .nm{flex:0 0 5.6em;font-weight:700;font-size:calc(var(--fs) - 2px)}
  .vrow .bb{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .vrow .bb i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
  .vrow .pc{flex:0 0 5.2em;text-align:right;font-size:calc(var(--fs) - 4px);color:var(--tx2);
            font-variant-numeric:tabular-nums}
  .vrow.cur .nm{color:var(--pri)}
  .due{display:flex;gap:7px;align-items:flex-end;height:84px;padding:10px 2px 0}
  .due .d{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;
          font-size:10px;color:var(--tx2);height:100%}
  .due .d i{display:block;width:100%;background:var(--pri-soft);border-radius:6px 6px 0 0;min-height:3px}
  .due .d i.on{background:var(--pri)}
  .due .d b{font-size:11px;color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
  .plan{margin-top:8px;font-size:calc(var(--fs) - 3px);line-height:1.75;color:var(--tx2)}
  .plan b{color:var(--tx)}
  .ovmode .opts{display:none}
  #tts{display:none}
  .card.open ~ .acts #tts{display:block}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;
         max-width:82vw;padding:10px 15px;border-radius:12px;background:rgba(20,28,30,.92);
         color:#fff;font-size:calc(var(--fs) - 2px);line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="hd">
  <a href="index.html" aria-label="返回">‹</a>
  <div>
    <div class="tt">背诵</div>
    <div class="ts" id="sub">正在加载…</div>
  </div>
  <a href="#" class="ovlnk" data-a="ov">总览</a>
</div>

<div class="bar"><i id="prog"></i></div>
<div class="stat">
  <span>今日新学 <b id="sNew">0</b>/<span id="sGoal">30</span></span>
  <span>复习 <b id="sRev">0</b></span>
  <span>连对 <b id="sStreak">0</b></span>
  <span id="sLeft"></span>
</div>

<main id="pane"></main>

<div class="opts" id="opts">
  <div class="row"><span>范围</span>
    <div class="seg" id="segVol"></div>
  </div>
  <div class="row"><span>每日新卡</span>
    <div class="seg" id="segGoal">
      <button data-goal="20">20</button><button data-goal="30" class="on">30</button>
      <button data-goal="50">50</button><button data-goal="80">80</button>
    </div>
  </div>
  <div class="row"><span>只看</span>
    <div class="seg" id="segMode">
      <button data-mode="all" class="on">全部</button><button data-mode="hot">高频</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="beisong.js"></script>
</body>
</html>
