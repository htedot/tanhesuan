<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能操作机考模拟 · 碳核算</title>
<style>
  :root{
    --navy:#1e3a5f; --navy2:#2b5285; --ink:#1f2937; --ink2:#5b6675;
    --line:#d7dde5; --bg:#eef1f5; --card:#fff; --ok:#137a4b; --okbg:#e6f4ec;
    --bad:#b3261e; --badbg:#fdecea; --mark:#b26a00; --markbg:#fff3e0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:var(--ink); background:var(--bg);
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* 页面根容器：顶栏/主体/底栏要靠它撑成列布局 */
  #app{display:flex;flex-direction:column;height:100vh;min-height:0}
  /* ---------- 顶栏 ---------- */
  #topbar{flex:0 0 56px;display:flex;align-items:center;gap:14px;padding:0 18px;
    background:var(--navy);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:30}
  #topbar .title{font-size:16px;font-weight:700;letter-spacing:.5px}
  #topbar .sub{font-size:12px;color:#b9c8dc;margin-left:2px}
  #topbar .sp{flex:1}
  #tm{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;letter-spacing:1px}
  #tm.warn{color:#ffb4a8;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.45}}
  #topbar .who{font-size:13px;color:#cfdcea;text-align:right;line-height:1.35}
  #btnCalc{height:38px;padding:0 16px;border:1px solid #7f95b3;border-radius:4px;background:transparent;
    color:#e6eefb;font:inherit;font-weight:700;cursor:pointer;margin-right:8px}
  #btnCalc:hover{background:rgba(255,255,255,.12)}
  #btnSubmit{height:38px;padding:0 20px;border:0;border-radius:4px;background:#c0392b;color:#fff;
    font:inherit;font-weight:700;cursor:pointer}
  #btnSubmit:hover{background:#a93226}
  #btnSubmit:disabled{background:#7c8a9c;cursor:default}

  /* ---------- 主体 ---------- */
  #main{flex:1;display:flex;min-height:0}
  #side{flex:0 0 244px;background:var(--card);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:auto}
  #side .cand{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
  #side .cand b{display:block;font-size:15px;color:var(--ink);margin-bottom:2px}
  #side h3{margin:0;padding:12px 16px 6px;font-size:13px;color:var(--ink2);font-weight:700}
  #navGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 12px}
  #navGrid button{height:38px;border:1px solid var(--line);border-radius:4px;background:#fff;
    color:var(--ink2);font:inherit;font-weight:700;cursor:pointer;position:relative}
  #navGrid button.done{background:var(--okbg);border-color:#a9d8bf;color:var(--ok)}
  #navGrid button.cur{outline:2px solid var(--navy2);outline-offset:-2px;color:var(--navy)}
  #navGrid button.marked::after{content:'';position:absolute;top:3px;right:3px;width:7px;height:7px;
    border-radius:50%;background:var(--mark)}
  #legend{padding:0 16px 12px;font-size:12px;color:var(--ink2);line-height:1.9}
  #legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--line);
    border-radius:2px;margin-right:6px;vertical-align:middle}
  #legend .l1{background:#bfe3cf;border-color:#5aa981}
  #legend .l2{background:var(--mark);border-color:var(--mark)}
  #markBar{padding:0 16px 16px}
  #markBar button{width:100%;height:36px;border:1px solid var(--mark);border-radius:4px;
    background:var(--markbg);color:var(--mark);font:inherit;font-weight:700;cursor:pointer}
  #markBar button.on{background:var(--mark);color:#fff}

  #stage{flex:1;overflow:auto;padding:18px 22px 28px}
  #stage>.qhead,#stage>.panel{max-width:1180px;margin-left:auto;margin-right:auto}
  .qhead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
  .qhead .no{font-size:17px;font-weight:800}
  .qhead .pt{color:var(--navy2);font-weight:700;font-size:13px}
  .qhead .sp{flex:1}
  .qhead button{height:32px;padding:0 14px;border:1px solid var(--navy2);background:#fff;color:var(--navy2);
    border-radius:4px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .stem{font-size:15px;line-height:1.85;color:#26303d}
  .sub{margin-top:18px}
  .sub .sa{font-size:14px;font-weight:700;color:#26303d}
  .sub .sa em{font-style:normal;color:var(--navy2);margin-right:6px}
  .sub .sa .badge{display:inline-block;margin-left:8px;padding:0 7px;border-radius:3px;
    background:#e8eef7;color:var(--navy2);font-size:12px;font-weight:700}
  textarea.ans{width:100%;margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:4px;
    font:inherit;font-size:14px;line-height:1.8;color:var(--ink);resize:vertical;background:#fcfdfe}
  textarea.ans:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(43,82,133,.12)}
  .cells{margin-top:10px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .cells .hd{display:grid;grid-template-columns:1fr 170px 90px;gap:0;background:#f4f7fb;
    padding:8px 14px;font-size:12px;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line)}
  .cells .row{display:grid;grid-template-columns:1fr 170px 90px;align-items:center;gap:0;
    padding:8px 14px;border-bottom:1px solid #eef1f5;font-size:13px}
  .cells .row:last-child{border-bottom:0}
  .cells input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:3px;
    font:inherit;font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
  .cells input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(43,82,133,.12)}
  .cells .u{font-size:12px;color:var(--ink2);padding-left:8px}

  /* ---------- 底栏 ---------- */
  #footbar{flex:0 0 54px;display:flex;align-items:center;gap:12px;padding:0 18px;
    background:var(--card);border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
  #footbar .sp{flex:1}
  #footbar button{height:36px;padding:0 22px;border:1px solid var(--line);background:#fff;
    border-radius:4px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
  #footbar button:disabled{color:#b7c0cc;cursor:default}
  #saveState{color:var(--ok)}

  /* ---------- 资料抽屉 ---------- */
  #docpanel{position:fixed;top:56px;right:-460px;bottom:54px;width:460px;z-index:40;
    background:var(--card);border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.08);
    display:flex;flex-direction:column;transition:right .22s ease}
  #docpanel.on{right:0}
  #docpanel .ph{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;background:#f7f9fc}
  #docpanel .ph button{height:30px;padding:0 10px;border:1px solid var(--line);background:#fff;
    border-radius:3px;font:inherit;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer}
  #docpanel .ph button.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
  #docpanel .ph .x{margin-left:auto;border:0;font-size:16px;background:transparent;cursor:pointer}
  #docbody{flex:1;overflow:auto;padding:14px}
  #docbody h4{margin:0 0 10px;font-size:14px}
  table.d{width:100%;border-collapse:collapse;font-size:12.5px}
  table.d th,table.d td{border:1px solid #e6eaf0;padding:6px 8px;text-align:left;line-height:1.5}
  table.d th{background:#f4f7fb;color:var(--ink2);font-weight:700;white-space:nowrap}
  table.d td{font-variant-numeric:tabular-nums}
  .dnote{margin-top:10px;color:var(--ink2);font-size:12px;line-height:1.6}

  /* ---------- 弹窗 ---------- */
  #modal{position:fixed;inset:0;z-index:60;background:rgba(20,30,45,.45);display:none;
    align-items:center;justify-content:center}
  #modal.on{display:flex}
  #modal .box{width:520px;max-width:92vw;background:#fff;border-radius:8px;padding:22px 24px;
    box-shadow:0 12px 40px rgba(0,0,0,.28)}
  #modal h3{margin:0 0 10px;font-size:17px}
  #modal p,#modal li{font-size:13.5px;color:var(--ink2);line-height:1.8}
  #modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  #modal .acts button{height:38px;padding:0 20px;border-radius:4px;border:1px solid var(--line);
    background:#fff;font:inherit;font-weight:700;cursor:pointer}
  #modal .acts .danger{background:#c0392b;border-color:#c0392b;color:#fff}

  /* ---------- 交卷后 ---------- */
  .result{max-width:960px;margin:0 auto}
  .result .big{display:flex;align-items:baseline;gap:14px;margin:6px 0 4px}
  .result .big b{font-size:46px;color:var(--navy)}
  .result .big span{color:var(--ink2)}
  .result .split{display:flex;gap:14px;margin:14px 0}
  .result .split div{flex:1;background:#f4f7fb;border:1px solid var(--line);border-radius:6px;padding:12px 14px;
    font-size:13px;color:var(--ink2)}
  .result .split b{display:block;font-size:20px;color:var(--ink);margin-top:2px}
  .qrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);
    border-radius:4px;background:#fff;margin-bottom:8px;cursor:pointer}
  .qrow:hover{border-color:var(--navy2)}
  .qrow .t{flex:1;font-weight:700;font-size:13.5px}
  .qrow .s{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .qrow .s.low{color:var(--bad)}
  .rv{margin-bottom:14px}
  .rv h3{margin:0 0 8px;font-size:15px}
  .kv{padding:8px 0;border-top:1px dashed var(--line);font-size:13px;line-height:1.75}
  .kv:first-of-type{border-top:0}
  .kv .k{color:var(--ink2);font-size:12px}
  .hit{color:var(--ok);font-weight:700}
  .miss{color:var(--bad);font-weight:700}
  .model{white-space:pre-wrap;font-size:13px;line-height:1.9}
  .tip{margin-top:10px;padding:10px 12px;border-left:3px solid var(--mark);background:var(--markbg);
    font-size:13px;line-height:1.75;color:#6b4400}
  .toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:70;
    background:rgba(25,35,50,.92);color:#fff;padding:10px 18px;border-radius:5px;font-size:13px;display:none}
  .toast.on{display:block}
  /* ---------- 计算器 ---------- */
  #kcalc{display:none;position:fixed;left:0;top:0;width:288px;z-index:80;background:#fff;
    border:1px solid #c5cfdb;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.22);user-select:none}
  #kcalc.on{display:block}
  .kc-bar{display:flex;align-items:center;height:32px;padding:0 8px 0 12px;cursor:move;
    background:#eef2f8;border-bottom:1px solid #dbe2ea;border-radius:8px 8px 0 0}
  .kc-tt{font-size:12px;font-weight:700;color:#3a4a60}
  .kc-x{margin-left:auto;height:22px;width:22px;border:0;background:transparent;cursor:pointer;
    color:#5b6675;font-size:13px;border-radius:4px}
  .kc-x:hover{background:#dde5ef}
  .kc-expr{min-height:18px;padding:8px 12px 0;text-align:right;font-size:12px;color:#5b6675;
    font-variant-numeric:tabular-nums;word-break:break-all}
  .kc-disp{padding:2px 12px 8px;text-align:right;font-size:26px;font-weight:800;color:#1f2937;
    font-variant-numeric:tabular-nums;word-break:break-all}
  .kc-hist{display:none;max-height:72px;overflow:auto;margin:0 10px 6px;padding:6px 8px;
    background:#f6f8fb;border-radius:4px;font-size:11px;color:#5b6675;white-space:pre;line-height:1.6}
  .kc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 10px 8px}
  .kc-k{height:36px;border:1px solid #d7dde5;border-radius:5px;background:#fff;color:#1f2937;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .kc-k:hover{background:#f2f6fb}
  .kc-k:active{background:#e6eef8}
  .kc-k.op{background:#eaf1fa;border-color:#c3d5ec;color:#1e3a5f}
  .kc-k.fn{background:#f4f6f9;color:#5b6675}
  .kc-k.eq{background:#1e3a5f;border-color:#1e3a5f;color:#fff;font-weight:800}
  .kc-k.fill{grid-column:span 1;background:#e6f4ec;border-color:#a9d8bf;color:#137a4b;font-size:12px;grid-row:span 1}
  .kc-fillrow{padding:0 10px 8px}
.kc-fillbtn{width:100%;height:36px;border:1px solid #a9d8bf;border-radius:5px;background:#e6f4ec;color:#137a4b;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.kc-fillbtn:hover{background:#d7ede1}
.kc-tip{padding:0 10px 8px;font-size:11px;color:#8b96a5;text-align:center}
  /* 窄屏兜底 */
  @media (max-width:900px){
    #side{display:none}
    #docpanel{width:100%;right:-100%}
    #stage{padding:12px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="exam_core.js"></script>
<script src="kaoshi_calc.js"></script>
<script src="kaoshi.js"></script>
</body>
</html>
