<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-font="md">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>资料库 · 碳核算</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{padding-bottom:28px}
  html,body{max-width:100%;overflow-x:hidden}
  .hd{display:flex;align-items:center;gap:10px;padding:16px 14px 8px}
  .hd a{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:var(--pri-soft);
        color:var(--pri);display:flex;align-items:center;justify-content:center;
        font-size:20px;text-decoration:none;font-weight:700}
  .hd .tt{font-size:calc(var(--fs) + 3px);font-weight:800;line-height:1.2}
  .hd .ts{font-size:calc(var(--fs) - 3px);color:var(--tx2);margin-top:2px}
  #volchips{display:flex;gap:8px;overflow-x:auto;padding:6px 12px 10px;-webkit-overflow-scrolling:touch}
  #volchips button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--tx);
                   font:inherit;font-size:calc(var(--fs) - 2px);font-weight:700;padding:9px 13px;min-height:40px;
                   border-radius:12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
  #volchips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
  #volchips .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  #volchips button.on .dot{background:#fff}
  .search{margin:0 12px 10px;display:flex;gap:8px}
  .search input{flex:1;min-width:0;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);
                background:var(--card);color:var(--tx);font:inherit;font-size:calc(var(--fs) - 2px)}
  .search input:focus{outline:none;border-color:var(--pri)}
  .search button{border:0;background:var(--pri-soft);color:var(--pri);font:inherit;font-weight:700;
                 font-size:calc(var(--fs) - 2px);padding:0 14px;min-height:44px;border-radius:12px;cursor:pointer}
  .tools{display:flex;gap:8px;margin:0 12px 10px}
  .tools button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--tx2);
                font:inherit;font-size:calc(var(--fs) - 3px);font-weight:700;padding:9px 6px;min-height:40px;
                border-radius:11px;cursor:pointer}
  .tools button.on{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
  #results{margin:0 12px 12px}
  #results .hit{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;
                box-shadow:var(--shadow);cursor:pointer}
  #results .hv{font-size:calc(var(--fs) - 4px);color:var(--pri);font-weight:700}
  #results .ht{font-size:calc(var(--fs) - 2px);line-height:1.55;margin-top:3px}
  #results mark{background:#ffe08a;color:#4a3600;padding:0 2px;border-radius:3px}
  .volhead{margin:0 12px 10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:13px 14px}
  .volhead .vn{font-size:calc(var(--fs) + 1px);font-weight:800;line-height:1.35}
  .volhead .vd{font-size:calc(var(--fs) - 2px);color:var(--tx2);line-height:1.6;margin-top:5px}
  .volhead .vm{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .volhead .vm span{font-size:calc(var(--fs) - 4px);color:var(--tx2);background:var(--bg);
                    border-radius:8px;padding:4px 8px}
  #toc{margin:0 12px 10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  #toc>summary{padding:12px 14px;font-weight:700;font-size:calc(var(--fs) - 1px);color:var(--pri);
               cursor:pointer;list-style:none;display:block;position:relative;padding-right:38px}
  #toc>summary::-webkit-details-marker{display:none}
  #toc>summary::after{content:'＋';position:absolute;right:14px;top:10px;color:var(--tx2)}
  #toc[open]>summary::after{content:'－'}
  #toc .ti{padding:9px 14px;border-top:1px solid var(--line);font-size:calc(var(--fs) - 2px);
           line-height:1.5;cursor:pointer}
  #toc .ti.l1{font-weight:800}
  #toc .ti.l2{padding-left:26px}
  #toc .ti.l3{padding-left:38px;color:var(--tx2)}
  #body{margin:0 12px}
  #body .blk{margin-bottom:10px;line-height:1.75;font-size:calc(var(--fs) - 1px);
             min-width:0;overflow-wrap:anywhere}
  #body h1,#body h2,#body h3,#body h4,#body h5,#body h6{line-height:1.4;margin:0 0 6px;font-weight:800}
  #body h1{font-size:calc(var(--fs) + 4px)}
  #body h2{font-size:calc(var(--fs) + 2px);padding-top:10px;border-top:1px solid var(--line)}
  #body h3{font-size:calc(var(--fs) + 1px)}
  #body h4,#body h5,#body h6{font-size:var(--fs);color:var(--tx2)}
  #body p{margin:0;background:var(--card);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow)}
  #body ul,#body ol{margin:0;background:var(--card);border-radius:12px;padding:11px 13px 11px 30px;
                    box-shadow:var(--shadow);overflow-wrap:anywhere}
  #body li{margin:3px 0}
  #body .tw{overflow-x:auto;max-width:100%;background:var(--card);border-radius:12px;box-shadow:var(--shadow)}
  #body table{border-collapse:collapse;width:100%;font-size:calc(var(--fs) - 3px);min-width:420px}
  #body th,#body td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;
                    line-height:1.55;overflow-wrap:anywhere}
  #body th{background:var(--pri-soft);color:var(--pri);font-weight:700;white-space:nowrap}
  .swipe{font-size:calc(var(--fs) - 5px);color:var(--tx2);margin:-4px 0 6px;text-align:right}
  #body code{background:var(--pri-soft);color:var(--pri);padding:1px 5px;border-radius:5px;font-size:.94em}
  #body blockquote{margin:0;background:var(--warn-soft);color:#7c4a03;border-radius:12px;padding:11px 13px}
  #body hr{border:0;border-top:1px dashed var(--line);margin:14px 0}
  #body .code{background:#17222a;color:#d8e6ea;border-radius:12px;padding:11px 13px;overflow-x:auto;
              font-family:ui-monospace,Consolas,monospace;font-size:calc(var(--fs) - 4px);
              line-height:1.6;white-space:pre}
  #body .blk.hitflash{animation:fl 1.6s ease}
  @keyframes fl{0%{background:#ffe08a}100%{background:transparent}}
  .footnav{display:flex;gap:8px;margin:14px 12px 0}
  .footnav button{flex:1;padding:11px 0;font-size:calc(var(--fs) - 1px)}
  #bar{height:6px;border-radius:3px;background:var(--line);margin:8px 12px 0;overflow:hidden}
  #bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
  #empty{margin:0 12px;padding:16px;border-radius:12px;background:var(--card);color:var(--tx2);
         text-align:center;line-height:1.7;font-size:calc(var(--fs) - 2px)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:99;max-width:82vw;
         padding:11px 16px;border-radius:12px;background:rgba(20,28,30,.92);color:#fff;
         font-size:calc(var(--fs) - 2px);line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="hd">
  <a href="index.html" aria-label="返回">‹</a>
  <div>
    <div class="tt">资料库</div>
    <div class="ts" id="sub">官方考查范围对应的学习资料</div>
  </div>
</div>
<div id="bar"><i></i></div>
<div id="volchips"></div>
<div class="search">
  <input id="q" type="search" placeholder="搜全文：如 1.75 亿千瓦 / 取舍准则 / 24067" enterkeyhint="search">
  <button id="qclear" type="button">清空</button>
</div>
<div class="tools">
  <button id="scope" type="button" data-scope="all">搜索范围：全部卷</button>
  <button id="fs" type="button">字号：中</button>
  <button id="recite" type="button">背诵本卷</button>
</div>
<div id="results"></div>
<main id="pane"></main>
<div class="toast" id="toast" hidden></div>
<script src="ziliao.js"></script>
</body>
</html>
